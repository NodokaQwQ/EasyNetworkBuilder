name: Validate ENB release catalogs
on:
  push:
    paths: ['releases/**', 'scripts/release.py', '.github/workflows/release-catalog.yml']
  pull_request:
    paths: ['releases/**', 'scripts/release.py', '.github/workflows/release-catalog.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/release.py validate
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
